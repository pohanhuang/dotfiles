# ============================================================
# Basic
# ============================================================

set -g default-terminal "tmux-256color"

set  -g base-index 1
setw -g pane-base-index 1

set -g status-keys vi
set -g mode-keys vi

set -g mouse on
set -g focus-events on

setw -g aggressive-resize off
setw -g clock-mode-style 24

set -s escape-time 0
set -g history-limit 2000

set -g detach-on-destroy off


# ============================================================
# Clipboard
# ============================================================

# We intentionally DO NOT use tmux native clipboard handling.
#
# All copy operations are piped to:
#
#   ~/.config/tmux/scripts/yank-osc52.sh
#
# That script sends:
#
#   OSC52
#     wrapped in
#   tmux DCS passthrough
#
# when running inside tmux.
#
# This avoids conflicts between:
#   - tmux set-clipboard
#   - tmux-yank
#   - custom OSC52 handling

set -s set-clipboard off
set -g allow-passthrough on


# ============================================================
# Pane navigation
# ============================================================

# Ctrl-h/j/k/l is handled by vim-tmux-navigator.

bind-key -r ^ last-window

bind-key k select-pane -U
bind-key j select-pane -D
bind-key h select-pane -L
bind-key l select-pane -R


# ============================================================
# Pane resizing
# ============================================================

bind-key -r C-k resize-pane -U 5
bind-key -r C-j resize-pane -D 5
bind-key -r C-h resize-pane -L 5
bind-key -r C-l resize-pane -R 5


# ============================================================
# Split windows
# ============================================================

unbind %

bind | split-window -h -c "#{pane_current_path}"

unbind '"'

bind - split-window -v -c "#{pane_current_path}"


# ============================================================
# sesh
# ============================================================

bind-key C-j run-shell "sesh connect \"$(
  tmux ls -F '##{session_created} ##{session_name}' \
    | grep -v '_popup' \
    | sort -n -k1 \
    | cut -d' ' -f2- \
    | fzf-tmux -p 30%,30% \
        --layout reverse \
        --no-input \
        --no-sort \
        --ansi \
        --border-label ' sesh quick session select ' \
        --prompt '⚡  ' \
        --bind 'load:jump-accept'
)\""


bind-key w run-shell "sesh connect \"$(
  sesh list --icons \
    | grep -v '_popup' \
    | fzf-tmux -p 80%,70% \
        --no-sort \
        --ansi \
        --border-label ' sesh ' \
        --prompt '⚡  ' \
        --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
        --bind 'tab:down,btab:up' \
        --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons | grep -v \"_popup\")' \
        --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons | grep -v \"_popup\")' \
        --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
        --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
        --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
        --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons | grep -v \"_popup\")' \
        --preview-window 'right:55%' \
        --preview 'sesh preview {}'
)\""

bind-key x kill-pane

bind-key -N "last-session (via sesh)" L run-shell "sesh last"


# ============================================================
# Scratch pads
# ============================================================

# General
bind-key t display-popup \
  -E \
  -w 80% \
  -h 80% \
  ~/.config/tmux/scripts/tmux-scratch.sh

# AI / Prompt
bind-key p display-popup \
  -E \
  -w 80% \
  -h 80% \
  ~/.config/tmux/scripts/tmux-scratch-ai.sh

# Notes / System
bind-key n display-popup \
  -E \
  -w 80% \
  -h 80% \
  ~/.config/tmux/scripts/tmux-scratch-system.sh


# ============================================================
# Claude Code sessions
# ============================================================

bind-key C display-popup \
  -E \
  -w 80% \
  -h 60% \
  ~/.config/tmux/scripts/tmux-claude-sessions.sh


# ============================================================
# Popup controls
# ============================================================

bind-key -T popup Escape detach-client
bind-key -T popup C-g detach-client
bind-key -T popup C-d detach-client

unbind -T popup Tab

# C-[ is the same terminal byte as Escape.
# Do not bind it separately.
unbind -T popup C-[


# ============================================================
# Popup mouse support
# ============================================================

bind-key -T popup MouseDown1Pane \
  select-pane

bind-key -T popup MouseDrag1Pane \
  if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
    { send-keys -M } \
    { copy-mode -M }

bind-key -T popup MouseDown1Status \
  select-window -t =

bind-key -T popup MouseDrag1Border \
  resize-pane -M

bind-key -T popup WheelUpPane \
  if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
    { send-keys -M } \
    { copy-mode -e }

bind-key -T popup WheelDownPane \
  send-keys -M

bind-key -T popup DoubleClick1Pane \
  select-pane \; \
  copy-mode -M \; \
  send-keys -X select-word

bind-key -T popup TripleClick1Pane \
  select-pane \; \
  copy-mode -M \; \
  send-keys -X select-line


# ============================================================
# Copy mode
# ============================================================

bind-key -T copy-mode-vi v \
  send-keys -X begin-selection

bind-key -T copy-mode-vi C-v \
  send-keys -X rectangle-toggle

bind-key -T copy-mode-vi Escape \
  send-keys -X cancel


# ------------------------------------------------------------
# Clipboard copy
# ------------------------------------------------------------
#
# IMPORTANT:
#
# DO NOT use:
#
#   copy-selection-and-cancel
#
# because that relies on tmux's native set-clipboard mechanism.
#
# Instead pipe selected text into our OSC52 script.
#

bind-key -T copy-mode-vi y \
  send-keys -X copy-pipe-and-cancel \
  "~/.config/tmux/scripts/yank-osc52.sh #{client_tty}"

bind-key -T copy-mode-vi Enter \
  send-keys -X copy-pipe-and-cancel \
  "~/.config/tmux/scripts/yank-osc52.sh #{client_tty}"

bind-key -T copy-mode-vi MouseDragEnd1Pane \
  send-keys -X copy-pipe-and-cancel \
  "~/.config/tmux/scripts/yank-osc52.sh #{client_tty}"

bind-key -T copy-mode-vi DoubleClick1Pane \
  select-pane \; \
  send-keys -X select-word \; \
  send-keys -X copy-pipe-and-cancel \
  "~/.config/tmux/scripts/yank-osc52.sh #{client_tty}"

bind-key -T copy-mode-vi TripleClick1Pane \
  select-pane \; \
  send-keys -X select-line \; \
  send-keys -X copy-pipe-and-cancel \
  "~/.config/tmux/scripts/yank-osc52.sh #{client_tty}"


# ============================================================
# Scroll wheel
# ============================================================

bind-key -n WheelUpPane \
  if-shell -F -t = "#{mouse_any_flag}" \
    "send-keys -M" \
    "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"


# ============================================================
# tmux buffer paste
# ============================================================

# NOTE:
# This pastes tmux's own paste buffer.
# It is NOT reading the macOS clipboard.

bind-key -T popup ] paste-buffer
bind-key -T popup P paste-buffer


# ============================================================
# Session list popup
# ============================================================

bind-key C-o display-popup \
  -E \
  -b rounded \
  -T " Sessions" \
  -w 30% \
  -h 50% \
  ~/.config/tmux/scripts/tmux-menu.sh


# ============================================================
# TokyoNight
# ============================================================

set -g mode-style \
  "fg=#7aa2f7,bg=#3b4261"

set -g message-style \
  "fg=#7aa2f7,bg=#3b4261"

set -g message-command-style \
  "fg=#7aa2f7,bg=#3b4261"

set -g pane-border-style \
  "fg=#3b4261"

set -g pane-active-border-style \
  "fg=#7aa2f7"


# ============================================================
# Status bar
# ============================================================

set -g status on
set -g status-position bottom
set -g status-justify left

set -g status-style \
  "fg=#7aa2f7,bg=#16161e"

set -g status-left-length 100
set -g status-right-length 100

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left ""

set -g status-right \
  "#[fg=#15161e,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#16161e,nobold,nounderscore,noitalics]"


setw -g window-status-activity-style \
  "underscore,fg=#a9b1d6,bg=#16161e"

setw -g window-status-separator ""

setw -g window-status-style \
  "NONE,fg=#a9b1d6,bg=#16161e"

setw -g window-status-format \
  "#[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]"

setw -g window-status-current-format \
  "#[fg=#16161e,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#3b4261,bold] #I  #W #F #[fg=#3b4261,bg=#16161e,nobold,nounderscore,noitalics]"


# ============================================================
# Prefix highlight
# ============================================================

set -g @prefix_highlight_output_prefix \
  "#[fg=#e0af68]#[bg=#16161e]#[fg=#16161e]#[bg=#e0af68]"

set -g @prefix_highlight_output_suffix ""


# ============================================================
# Plugins
# ============================================================
#
# Install TPM:
#
# git clone https://github.com/tmux-plugins/tpm \
#   ~/.config/tmux/plugins/tpm
#
# Prefix + I → install plugins
#

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'christoomey/vim-tmux-navigator'


# IMPORTANT:
#
# tmux-yank intentionally removed.
#
# Do NOT add:
#
# set -g @plugin 'tmux-plugins/tmux-yank'
#
# because clipboard is now handled by yank-osc52.sh only.


# ============================================================
# TPM initialization
# ============================================================

set-environment -g TMUX_PLUGIN_MANAGER_PATH \
  '~/.config/tmux/plugins'

run '~/.config/tmux/plugins/tpm/tpm'


# ============================================================
# FINAL OVERRIDES
# ============================================================
#
# Keep clipboard behavior deterministic even if a plugin
# modifies related settings.
#

set -s set-clipboard external
set -g allow-passthrough on

# C-[ == Escape at the terminal level.
unbind -T popup C-[

bind-key T display-popup \
  -E \
  -w 80% \
  -h 80% \
  bash
