onboarding = false

# =============================================================================
# Keybindings
# =============================================================================

[keys]
prefix = "ctrl+b"

# Move panes with ctrl+hjkl (nvim style)
focus_pane_left  = "ctrl+h"
focus_pane_down  = "ctrl+j"
focus_pane_up    = "ctrl+k"
focus_pane_right = "ctrl+l"

# Detach
detach = "prefix+q"

# Settings (default was prefix+s)
settings = "prefix+,"

# Move tabs with opt+h/l
previous_tab = "alt+h"
next_tab     = "alt+l"

# Switch tabs by index
switch_tab = "prefix+1..9"

# Remap next/previous workspace
next_workspace     = "prefix+]"
previous_workspace = "prefix+["

# =============================================================================
# Custom command keybindings
# =============================================================================

# Workspace picker popup (fzf)
[[keys.command]]
key         = "prefix+w"
type        = "popup"
command     = "~/.config/herdr/workspace-picker.sh"
description = "workspace picker"
width       = "60%"
height      = "20%"

# Agent picker popup (fzf)
[[keys.command]]
key         = "prefix+a"
type        = "popup"
command     = "~/.config/herdr/agent-picker.sh"
description = "agent picker"
width       = "60%"
height      = "20%"

# Init workspace tabs (nvim / pi / terminal)
[[keys.command]]
key         = "prefix+i"
type        = "shell"
command     = "~/.config/herdr/init-workspace.sh"
description = "init workspace tabs"

# Jump to named tabs (scoped to the current workspace)
[[keys.command]]
key         = "prefix+n"
type        = "shell"
command     = "~/.config/herdr/focus-tab.sh nvim"
description = "focus nvim tab"

[[keys.command]]
key         = "prefix+p"
type        = "shell"
command     = "~/.config/herdr/focus-tab.sh pi"
description = "focus pi tab"

[[keys.command]]
key         = "prefix+t"
type        = "shell"
command     = "~/.config/herdr/focus-tab.sh terminal"
description = "focus terminal tab"

# Jump to deployment tab (create if missing)
[[keys.command]]
key         = "prefix+d"
command     = "~/.config/herdr/focus-tab.sh deployment --create"
type        = "shell"
description = "focus or create deployment tab"

# =============================================================================
# UI
# =============================================================================

[ui]
# tab bar at the bottom: the top row's click hit-test is unreliable here
# (herdr #796). move it back to "top" once clicking the top row works.
tab_bar_position = "bottom"
sidebar_start_collapsed = true
sidebar_collapsed_mode  = "hidden"

[ui.toast]
delivery      = "terminal"
delay_seconds = 1

[theme]
name = "tokyo-night"
auto_switch = false
