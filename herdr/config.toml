onboarding = false

# =============================================================================
# Keybindings
# =============================================================================

[keys]
prefix = "ctrl+b"

# Move panes with ctrl+hjkl (nvim style)
focus_pane_left  = "ctrl+h"
focus_pane_down  = "ctrl+j"
focus_pane_up    = "ctrl+k"
focus_pane_right = "ctrl+l"

# Detach
detach = "prefix+d"

# Move tabs with opt+h/l
previous_tab = "alt+h"
next_tab     = "alt+l"

# Switch tabs by index
switch_tab = "prefix+1..9"

# Remap next/previous workspace
next_workspace     = "prefix+]"
previous_workspace = "prefix+["

# =============================================================================
# Custom command keybindings
# =============================================================================

# Workspace picker popup (fzf)
[[keys.command]]
key         = "prefix+w"
type        = "popup"
command     = "~/.config/herdr/workspace-picker.sh"
description = "workspace picker"
width       = "60%"
height      = "20%"

# Agent picker popup (fzf)
[[keys.command]]
key         = "prefix+a"
type        = "popup"
command     = "~/.config/herdr/agent-picker.sh"
description = "agent picker"
width       = "60%"
height      = "20%"

# Init workspace tabs (nvim / pi / terminal)
[[keys.command]]
key         = "prefix+i"
type        = "shell"
command     = "~/.config/herdr/init-workspace.sh"
description = "init workspace tabs"

# Jump to named tabs
[[keys.command]]
key         = "prefix+n"
type        = "shell"
command     = "herdr tab list | python3 -c \"import sys,json,os; tabs=json.load(sys.stdin)['result']['tabs']; m=next((t for t in tabs if t.get('label')=='nvim'),None); os.system(f'herdr tab focus {m[\\\"tab_id\\\"]}') if m else None\""
description = "focus nvim tab"

[[keys.command]]
key         = "prefix+p"
type        = "shell"
command     = "herdr tab list | python3 -c \"import sys,json,os; tabs=json.load(sys.stdin)['result']['tabs']; m=next((t for t in tabs if t.get('label')=='pi'),None); os.system(f'herdr tab focus {m[\\\"tab_id\\\"]}') if m else None\""
description = "focus pi tab"

[[keys.command]]
key         = "prefix+t"
type        = "shell"
command     = "herdr tab list | python3 -c \"import sys,json,os; tabs=json.load(sys.stdin)['result']['tabs']; m=next((t for t in tabs if t.get('label')=='terminal'),None); os.system(f'herdr tab focus {m[\\\"tab_id\\\"]}') if m else None\""
description = "focus terminal tab"

# Jump to deploy tab (create if missing)
[[keys.command]]
key         = "prefix+l"
type        = "shell"
command     = "herdr tab list | python3 -c \"import sys,json,os; ws=os.environ.get('HERDR_ACTIVE_WORKSPACE_ID',''); cwd=os.environ.get('HERDR_ACTIVE_PANE_CWD',os.path.expanduser('~')); tabs=json.load(sys.stdin)['result']['tabs']; tabs=[t for t in tabs if not ws or t.get('workspace_id')==ws]; m=next((t for t in tabs if t.get('label')=='deploy'),None); os.system(f\"herdr tab focus {m['tab_id']}\") if m else os.system(f\"herdr tab create --label deploy --focus --cwd {cwd}\" + (f\" --workspace {ws}\" if ws else ''))\""
description = "focus or create deploy tab"

# =============================================================================
# UI
# =============================================================================

[ui]
sidebar_start_collapsed = true
sidebar_collapsed_mode  = "hidden"

[ui.toast]
delivery      = "terminal"
delay_seconds = 1
