onboarding = false

# =============================================================================
# Keybindings
# =============================================================================

[keys]
prefix = "ctrl+b"

# Built-in pane focus unbound — ctrl+hjkl go to the vim-navigator plugin below
# (nvim-herdr-navigation; installed by .bashrc.d/herdr.sh)
focus_pane_left  = ""
focus_pane_down  = ""
focus_pane_up    = ""
focus_pane_right = ""

# Detach
detach = "prefix+q"

# Settings (default was prefix+s)
settings = "prefix+,"

# Move tabs with opt+h/l
previous_tab = "alt+h"
next_tab     = "alt+l"

# Switch tabs by index
switch_tab = "prefix+1..9"

# Reuse prefix+r for the review tab instead of resize mode.
resize_mode = ""

# Remap next/previous workspace
next_workspace     = "prefix+]"
previous_workspace = "prefix+["

# =============================================================================
# Custom command keybindings
# =============================================================================

# Vim-aware pane navigation: forwards ctrl+hjkl into nvim, else focuses pane
[[keys.command]]
key         = "ctrl+h"
type        = "plugin_action"
command     = "local.vim-navigator.left"
description = "vim-aware pane left"

[[keys.command]]
key         = "ctrl+j"
type        = "plugin_action"
command     = "local.vim-navigator.down"
description = "vim-aware pane down"

[[keys.command]]
key         = "ctrl+k"
type        = "plugin_action"
command     = "local.vim-navigator.up"
description = "vim-aware pane up"

[[keys.command]]
key         = "ctrl+l"
type        = "plugin_action"
command     = "local.vim-navigator.right"
description = "vim-aware pane right"

# Workspace picker popup (fzf)
[[keys.command]]
key         = "prefix+w"
type        = "popup"
command     = "~/.config/herdr/workspace-picker.sh"
description = "workspace picker"
width       = "60%"
height      = "60%"

# Agent picker popup (fzf)
[[keys.command]]
key         = "prefix+a"
type        = "popup"
command     = "~/.config/herdr/agent-picker.sh"
description = "agent picker"
width       = "60%"
height      = "20%"

# Init workspace tabs (nvim / pi / terminal / review)
[[keys.command]]
key         = "prefix+i"
type        = "shell"
command     = "~/.config/herdr/init-workspace.sh"
description = "init workspace tabs"

# Jump to named tabs (scoped to the current workspace)
[[keys.command]]
key         = "prefix+n"
type        = "shell"
command     = "~/.config/herdr/focus-tab.sh nvim"
description = "focus nvim tab"

[[keys.command]]
key         = "prefix+p"
type        = "shell"
command     = "~/.config/herdr/focus-tab.sh pi"
description = "focus pi tab"

[[keys.command]]
key         = "prefix+t"
type        = "shell"
command     = "~/.config/herdr/focus-tab.sh terminal"
description = "focus terminal tab"

[[keys.command]]
key         = "prefix+r"
type        = "shell"
command     = "~/.config/herdr/focus-tab.sh review"
description = "focus review tab"

# Jump to deployment tab (create if missing)
[[keys.command]]
key         = "prefix+d"
command     = "~/.config/herdr/focus-tab.sh deployment --create"
type        = "shell"
description = "focus or create deployment tab"

# =============================================================================
# UI
# =============================================================================

[ui]
# tab bar at the bottom: the top row's click hit-test is unreliable here
# (herdr #796). move it back to "top" once clicking the top row works.
tab_bar_position = "bottom"
sidebar_start_collapsed = true
sidebar_collapsed_mode  = "hidden"

status_indicators = "symbols"
[ui.toast]
delivery      = "terminal"
delay_seconds = 1

[theme]
name = "kanagawa"
auto_switch = false
