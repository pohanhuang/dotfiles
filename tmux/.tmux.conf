set  -g default-terminal "tmux-256color"
set  -g base-index      1
setw -g pane-base-index 1

set -g status-keys vi
set -g mode-keys   vi

set  -g mouse             on
set  -g focus-events      off
setw -g aggressive-resize off
setw -g clock-mode-style  24
set  -s escape-time       0
set  -g history-limit     2000

# vim-like pane switching
# Note: Ctrl-hjkl handled by vim-tmux-navigator plugin
bind-key -r ^ last-window
bind-key k select-pane -U
bind-key j select-pane -D
bind-key h select-pane -L
bind-key l select-pane -R

# vim-like pane resizing (stolen from rad-dotfile)
bind-key -r C-k resize-pane -U 5
bind-key -r C-j resize-pane -D 5
bind-key -r C-h resize-pane -L 5
bind-key -r C-l resize-pane -R 5

# Intuitive split windows (stolen from rad-dotfile)
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# sesh
bind-key C-j run-shell "sesh connect \"$(
  tmux ls -F '##{session_created} ##{session_name}' \
  | grep -v '_popup' | sort -n -k1 | cut -d' ' -f2- | fzf-tmux -p 30%,30% \
    --layout reverse --no-input --no-sort --ansi --border-label ' sesh quick session select ' --prompt '⚡  ' \
    --bind 'load:jump-accept'
)\""
bind-key w run-shell "sesh connect \"$(
  sesh list --icons | grep -v '_popup' | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons | grep -v \"_popup\")' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons | grep -v \"_popup\")' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons | grep -v \"_popup\")' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
bind-key -N "last-session (via sesh) " L run-shell "sesh last"

# Scratch Pads (multiple types per directory)
bind-key t display-popup -E -w 80% -h 80% ~/.config/tmux/scripts/tmux-scratch.sh      # General
bind-key p display-popup -E -w 80% -h 80% ~/.config/tmux/scripts/tmux-scratch-ai.sh   # AI/Prompt
bind-key n display-popup -E -w 80% -h 80% ~/.config/tmux/scripts/tmux-scratch-system.sh  # Notes/System

# Claude Code sessions list
bind-key C display-popup -E -w 80% -h 60% ~/.config/tmux/scripts/tmux-claude-sessions.sh  # Claude sessions

# Popup controls (work for all scratch pads)
bind-key -T popup Escape detach-client         # Press Escape to close popup
bind-key -T popup C-g detach-client            # Press Ctrl-g to close popup (alternative)
bind-key -T popup C-d detach-client            # Ctrl-d also closes popup
# Note: Use mouse scroll or Prefix+[ to enter copy mode (don't bind C-[ as it conflicts with Escape)
unbind -T popup Tab
unbind -T popup C-[                            # Unbind C-[ (Escape) to avoid conflict

# Full mouse support in popup table (copy from root table)
bind-key -T popup MouseDown1Pane select-pane
bind-key -T popup MouseDrag1Pane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -M }
bind-key -T popup MouseDown1Status select-window -t =
bind-key -T popup MouseDrag1Border resize-pane -M
bind-key -T popup WheelUpPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -e }
bind-key -T popup WheelDownPane send-keys -M
bind-key -T popup DoubleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-word
bind-key -T popup TripleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-line

# Copy mode vi bindings (for both normal and popup sessions)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# y key - copy to clipboard (tmux handles OSC 52 internally!)
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Mouse copy - tmux handles OSC 52 automatically
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-selection-and-cancel

# Scroll wheel to enter copy mode
bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind-key -T popup WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# Paste from tmux buffer (works in popup too)
bind-key -T popup ] paste-buffer
bind-key -T popup P paste-buffer

# Session list popup (stolen from rad-dotfile)
# Note: Prefix+w is for sesh (more powerful), this is a simpler alternative with Ctrl-o
bind-key C-o display-popup -E -b rounded -T " Sessions" -w 30% -h 50% ~/.config/tmux/scripts/tmux-menu.sh

# Set focus-events on (important for Neovim autoread)
set -g focus-events on

set -g detach-on-destroy off  # don't exit from tmux when closing a session

# TokyoNight colors for Tmux

set -g mode-style "fg=#7aa2f7,bg=#3b4261"

set -g message-style "fg=#7aa2f7,bg=#3b4261"
set -g message-command-style "fg=#7aa2f7,bg=#3b4261"

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

set -g status "on"
set -g status-justify "left"

set -g status-style "fg=#7aa2f7,bg=#16161e"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left ""
set -g status-right "#[fg=#15161e,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#16161e,nobold,nounderscore,noitalics]"

setw -g window-status-activity-style "underscore,fg=#a9b1d6,bg=#16161e"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#a9b1d6,bg=#16161e"
setw -g window-status-format "#[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#16161e,bg=#16161e,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#16161e,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#7aa2f7,bg=#3b4261,bold] #I  #W #F #[fg=#3b4261,bg=#16161e,nobold,nounderscore,noitalics]"

# tmux-plugins/tmux-prefix-highlight support
set -g @prefix_highlight_output_prefix "#[fg=#e0af68]#[bg=#16161e]#[fg=#16161e]#[bg=#e0af68]"
set -g @prefix_highlight_output_suffix ""

# OSC 52 clipboard support (works over SSH!)
set -g set-clipboard external  # Forward OSC 52 to outer terminal (not tmux buffer)
set -g allow-passthrough on    # Allow escape sequences to pass through

# tmux position
set -g status-position bottom

# ===== Plugins (stolen from rad-dotfile) =====
# Install tpm first: git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
# Then press prefix + I to install plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'  # Seamless vim-tmux navigation
set -g @plugin 'tmux-plugins/tmux-yank'          # Better copy mode

# Configure tmux-yank plugin (backup clipboard handler)
set -g @yank_with_mouse off  # We handle mouse copy with our bindings
set -g @yank_selection 'clipboard'
set -g @yank_action 'copy-pipe-no-clear'  # Keep selection after yank

# TPM initialization (keep this at the very bottom)
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'
run '~/.config/tmux/plugins/tpm/tpm'

# IMPORTANT: Re-bind copy keys AFTER plugins load (override tmux-yank)
# Use our OSC 52 script for both normal and popup sessions
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "~/.config/tmux/scripts/yank-osc52.sh"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "~/.config/tmux/scripts/yank-osc52.sh"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "~/.config/tmux/scripts/yank-osc52.sh"
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "~/.config/tmux/scripts/yank-osc52.sh"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "~/.config/tmux/scripts/yank-osc52.sh"

# IMPORTANT: Unbind C-[ in popup (after plugins load) so Escape can close popup
unbind -T popup C-[

# ============================================================
# FINAL OVERRIDES (must be at the very end)
# ============================================================
# Override any settings from .tmux.conf.local or plugins
set -g set-clipboard external
set -g allow-passthrough on
